server:
  port: ${SERVER_PORT:8443}
  address: 0.0.0.0
  ssl:
    enabled: true
    key-store: classpath:ssl/server.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: server
    protocol: TLS
    enabled-protocols:
      - TLSv1.2
      - TLSv1.3
    ciphers:
      - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
      - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
      - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
      - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
  error:
    include-message: always
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: strict
  http2:
    enabled: true
  encoding:
    charset: UTF-8
    force: true
    force-request: true
    force-response: true

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false

  application:
    name: secure-messenger

  datasource:
    url: jdbc:postgresql://localhost:5432/messenger_db
    username: ${DB_USERNAME:messenger_user}
    password: ${DB_PASSWORD:messenger_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        concurrency: 5
        max-concurrency: 20
        prefetch: 50

  servlet:
    multipart:
      enabled: true
      max-file-size: 1024MB
      max-request-size: 1024MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

# JWT Configuration - NO DEFAULT VALUE!
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days

# MinIO Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: messenger-files

# Encryption
encryption:
  signal:
    enabled: true

# WebSocket
websocket:
  endpoint: /ws
  allowed-origins: "*"

# Video Conference
webrtc:
  ice-servers:
    - url: stun:stun.l.google.com:19302
    - url: stun:stun1.l.google.com:19302
  turn-server:
    enabled: true

# Logging
logging:
  level:
    com.messenger: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Device Management
device:
  heartbeat:
    timeout: 2 # Minutes without heartbeat before marking device as offline (reduced for 10s checks)
    interval: 10 # Expected heartbeat interval in seconds
  settings:
    max-devices-per-user: 10
    allow-multiple-devices: true

# Application URLs for QR codes
app:
  server:
    url: ${SERVER_URL:https://localhost:8443}
  websocket:
    url: ${WEBSOCKET_URL:/ws}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# VAPID keys for push notifications - MUST BE SET IN ENVIRONMENT
vapid:
  public:
    key: ${VAPID_PUBLIC_KEY}
  private:
    key: ${VAPID_PRIVATE_KEY}
  subject: ${VAPID_SUBJECT:mailto:admin@example.com}

# SFU (Mediasoup) Configuration
sfu:
  base-url: http://localhost:3000
  timeout: 5000
  max-rooms-per-node: 10
  heartbeat-interval: 10000

# Rate Limiter Configuration
resilience4j:
  ratelimiter:
    instances:
      login:
        limit-for-period: 5
        limit-refresh-period: 60s
        timeout-duration: 0
        register-health-indicator: true
        event-consumer-buffer-size: 100
      register:
        limit-for-period: 3
        limit-refresh-period: 60s
        timeout-duration: 0
        register-health-indicator: true
        event-consumer-buffer-size: 100
      refresh:
        limit-for-period: 10
        limit-refresh-period: 60s
        timeout-duration: 0
        register-health-indicator: true
        event-consumer-buffer-size: 100

# Security headers
security:
  headers:
    hsts:
      enabled: true
      max-age: 31536000
      include-subdomains: true
    content-type-options: nosniff
    x-frame-options: DENY
    x-xss-protection: "1; mode=block"
