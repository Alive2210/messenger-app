# TURN/STUN Server Configuration for WebRTC
# Supports NAT traversal for video calls

# Listener IP address
listening-ip=0.0.0.0
listening-port=3478

# TLS/DTLS
tls-listening-port=5349

# Relay IP - must be accessible to all clients
relay-ip=0.0.0.0

# External IP - set via environment variable or auto-detect
# This MUST be a real IP, NOT 0.0.0.0
external-ip=${TURN_EXTERNAL_IP}

# Certificates (for TURNS/DTLS)
cert=/etc/coturn/certs/server.crt
pkey=/etc/coturn/certs/server.key

# Authentication
fingerprint
lt-cred-mech
realm=${TURN_REALM:-messenger.local}
server-name=${TURN_SERVER_NAME:-turn.messenger.local}

# Users
user=${TURN_USER:-messenger}:${TURN_PASS:-secure_password_123}

# Security
no-cli
no-tlsv1
no-tlsv1_1
cipher-list="ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384"

# Performance
max-bps=0
bps-capacity=0

# Session lifetime (long for video conferencing)
max-allocate-lifetime=3600
default-allocate-lifetime=600

# Limits
max-allocations-per-user=50
max-allocations-per-relay=1000

# UDP and TCP relay for NAT traversal
allow-udp-relay
allow-tcp-relay

# UDP for better performance
udp-self-balance

# RTP port range (must match docker port mapping)
min-port=49152
max-port=49200

# Logging
log-file=/var/log/coturn/turnserver.log
verbose
