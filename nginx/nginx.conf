user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=30r/m;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 1024M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/x-component;

    # CORS
    # NOTE: When Access-Control-Allow-Credentials=true, wildcard origins are invalid.
    # Reflect the request Origin when present; fall back to https://localhost otherwise.
    map $http_origin $cors_origin {
        default $http_origin;
        "" "https://localhost";
    }

    # Upstream for Spring Boot application
    upstream messenger_backend {
        server app:8080;
        keepalive 32;
    }

    # Upstream for Mediasoup SFU (Socket.IO)
    upstream messenger_sfu {
        server mediasoup-sfu:3000;
        keepalive 32;
    }

    # Upstream for frontend (optional - if not serving static files directly)
    upstream messenger_frontend {
        server frontend:80;
        keepalive 32;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL Certificate
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # TLS Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Service Worker must be served from origin root and must not be cached aggressively.
        location = /sw.js {
            root /usr/share/nginx/html;
            try_files /sw.js =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires -1;
            add_header Service-Worker-Allowed "/" always;
        }

        # Frontend static files - SERVE DIRECTLY
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # WebSocket support
        location /ws {
            proxy_pass http://messenger_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Auth endpoints with rate limiting
        location ~ ^/(api/auth/login|api/auth/register) {
            limit_req zone=login_limit burst=10 nodelay;
            limit_conn addr_limit 5;

            proxy_pass http://messenger_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # CORS headers
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Requested-With, Accept, Origin, X-CSRF-Token, X-Client-Info, Cookie' always;
            add_header Access-Control-Allow-Credentials 'true' always;
            add_header Access-Control-Max-Age 3600;
            add_header Vary "Origin, Accept-Encoding";

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD';
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Requested-With, Accept, Origin, X-CSRF-Token, X-Client-Info, Cookie';
                add_header Access-Control-Allow-Credentials 'true';
                add_header Access-Control-Max-Age 3600;
                return 204;
            }
        }

        # Socket.IO for SFU (Mediasoup)
        location /socket.io/ {
            proxy_pass http://messenger_sfu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            
            # CORS headers for SFU
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type, X-Requested-With, Accept, Origin' always;
            add_header Access-Control-Allow-Credentials 'true' always;
        }

        # API endpoints
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            limit_conn addr_limit 20;

            proxy_pass http://messenger_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # CORS headers
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Requested-With, Accept, Origin, X-CSRF-Token, X-Client-Info, Cookie' always;
            add_header Access-Control-Allow-Credentials 'true' always;
            add_header Access-Control-Max-Age 3600;
            add_header Vary "Origin, Accept-Encoding";

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD';
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Requested-With, Accept, Origin, X-CSRF-Token, X-Client-Info, Cookie';
                add_header Access-Control-Allow-Credentials 'true';
                add_header Access-Control-Max-Age 3600;
                return 204;
            }

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # MinIO file storage proxy
        location /messenger-files/ {
            proxy_pass http://minio:9000/messenger-files/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Required for MinIO
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            
            # Increase body size for file uploads
            client_max_body_size 1024M;
            
            # CORS headers for file access
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods 'GET, PUT, POST, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Origin, X-Requested-With' always;
            
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Methods 'GET, PUT, POST, DELETE, OPTIONS';
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Origin, X-Requested-With';
                return 204;
            }
        }

        # Actuator endpoints - no rate limiting
        location /actuator/ {
            proxy_pass http://messenger_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://messenger_backend/actuator/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }
    }
}
